services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: meetora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetora_password}
      POSTGRES_DB: ${POSTGRES_DB:-meetora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meetora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-meetora_user} -d $${POSTGRES_DB:-meetora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meetora_network

  # FastAPI Backend API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetora_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Meetora API"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-meetora_user}:${POSTGRES_PASSWORD:-meetora_password}@db:5432/${POSTGRES_DB:-meetora_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      HOST: "0.0.0.0"
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - meetora_network

volumes:
  meetora_pgdata:
    driver: local

networks:
  meetora_network:
    driver: bridge
